server.port=${SERVER_PORT:8002}
spring.application.name=auth-service

# Veritabanı Ayarları (Ortam değişkenlerinden okunur)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Ayarları
jwt.secret=${JWT_SECRET:CampusHubSuperSecretKeyForJwtAuthentication2026MustBeLongEnough}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Swagger UI Yolu
springdoc.swagger-ui.path=/swagger-ui.html